# Pasta Mo' : en-têtes de sécurité et cache pour Nginx (à inclure dans le bloc server { … } du site, servi en HTTPS).
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; media-src 'self' blob:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self' mailto:; frame-ancestors 'none'; upgrade-insecure-requests" always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
server_tokens off;
autoindex off;

# Vidéos et images : cache long (le nom de version ?v=… change à chaque montage) ; Nginx gère les requêtes partielles (Range)
location ~* \.(mp4|webp|svg)$ {
  expires 30d;
  add_header Cache-Control "public";
  # (les add_header d'un bloc location remplacent ceux du server : on répète les en-têtes de sécurité utiles)
  add_header X-Content-Type-Options "nosniff" always;
}
location ~* \.(css|js)$ { expires 7d; add_header X-Content-Type-Options "nosniff" always; }
